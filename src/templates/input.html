<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>数学解题</title>
    <style>
      body { max-width: 760px; margin: 48px auto; padding: 0 20px; font: 18px/1.7 system-ui, sans-serif; color: #202124; }
      .nav-bar { display: flex; gap: 12px; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #e2e8f0; font-size: 15px; }
      .nav-bar a { color: #64748b; text-decoration: none; padding: 6px 12px; border-radius: 6px; }
      .nav-bar a.active { color: #2563eb; background: #eff6ff; font-weight: 600; }
      .nav-bar a:hover:not(.active) { color: #1e293b; background: #f1f5f9; }
      input, textarea { box-sizing: border-box; width: 100%; font: inherit; padding: 10px; }
      textarea { min-height: 110px; resize: vertical; }
      button { margin-top: 16px; font: inherit; padding: 9px 18px; cursor: pointer; }
      .field { display: block; margin: 18px 0 6px; font-weight: 600; }
      .upload { border: 1px dashed #8a8f98; padding: 18px; min-height: 72px; background: #f7f8fa; }
      .upload.dragging { border-color: #1769aa; background: #eef6fc; }
      .preview { display: none; max-width: 100%; max-height: 360px; margin-top: 14px; object-fit: contain; }
      .status { margin: 8px 0 0; color: #555; }
      .error { color: #b00020; }
    </style>
  </head>
  <body>
    <div class="nav-bar">
      <a href="/" class="active">📐 函数自动求解</a>
      <a href="/ocr_test">✍️ 手写 OCR 测试台</a>
      <a href="/grade">📝 智能作业批改器</a>
    </div>
    <h1>一元二次函数解题</h1>
    <form method="post" action="/prepare" enctype="multipart/form-data">
      <label class="field" for="question">题干</label>
      <textarea id="question" name="question" placeholder="可直接输入题目文字">{{question}}</textarea>
      <label class="field" for="image">题目截图</label>
      <div class="upload" id="upload-area">
        <input id="image" name="image" type="file" accept="image/png,image/jpeg,image/webp">
        <p class="status" id="image-status">可选择、拖入或粘贴截图</p>
        <img class="preview" id="image-preview" alt="题目截图预览">
      </div>
      <button type="submit">识别题干</button>
    </form>
    <p class="error">{{error}}</p>
    <script>
      const imageInput = document.querySelector("#image");
      const imageStatus = document.querySelector("#image-status");
      const imagePreview = document.querySelector("#image-preview");
      const uploadArea = document.querySelector("#upload-area");
      let previewUrl = null;

      function setImage(file, source) {
        if (!file || !["image/png", "image/jpeg", "image/webp"].includes(file.type)) return;
        const files = new DataTransfer();
        files.items.add(file);
        imageInput.files = files.files;
        if (previewUrl) URL.revokeObjectURL(previewUrl);
        previewUrl = URL.createObjectURL(file);
        imagePreview.src = previewUrl;
        imagePreview.style.display = "block";
        imageStatus.textContent = `${source}：${file.name || "clipboard-image.png"}`;
      }

      document.addEventListener("paste", (event) => {
        const image = [...event.clipboardData.items]
          .find((item) => item.type.startsWith("image/"))
          ?.getAsFile();
        if (!image) return;
        event.preventDefault();
        setImage(image, "已粘贴截图");
      });

      imageInput.addEventListener("change", () => {
        if (imageInput.files[0]) setImage(imageInput.files[0], "已选择图片");
      });

      uploadArea.addEventListener("dragover", (event) => {
        event.preventDefault();
        uploadArea.classList.add("dragging");
      });
      uploadArea.addEventListener("dragleave", () => uploadArea.classList.remove("dragging"));
      uploadArea.addEventListener("drop", (event) => {
        event.preventDefault();
        uploadArea.classList.remove("dragging");
        setImage([...event.dataTransfer.files][0], "已拖入图片");
      });
    </script>
  </body>
</html>
