<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>确认题干</title>
    <style>
      body { max-width: 760px; margin: 48px auto; padding: 0 20px; font: 18px/1.7 system-ui, sans-serif; }
      textarea { box-sizing: border-box; width: 100%; min-height: 220px; font: inherit; padding: 8px; }
      button { margin-top: 16px; font: inherit; padding: 8px 16px; }
    </style>
  </head>
  <body>
    <h1>确认题干</h1>
    <p>请核对并按需修改识别结果，再开始求解。</p>
    <form method="post" action="/solve">
      <label for="question">题干</label>
      <textarea id="question" name="question" required>{{question}}</textarea>
      <button type="submit">开始求解</button>
    </form>
  </body>
</html>
