<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <style>
      body { max-width: 760px; margin: 48px auto; padding: 0 20px; color: #202124; font: 18px/1.7 system-ui, sans-serif; }
      h1 { font-size: 1.7em; } h2 { margin-top: 1.5em; font-size: 1.25em; } h3 { margin-top: 1.3em; font-size: 1.1em; }
      section { margin: 28px 0; } .formula { margin: 12px 0; overflow-x: auto; }
      .description, .reused { color: #555; } .answer { font-weight: 600; }
      .unsupported { color: #8a5a00; } .failed { color: #b00020; }
      .question { padding: 14px; border-left: 3px solid #777; background: #f6f7f8; white-space: pre-wrap; }
      .problem-item { border-top: 1px solid #ddd; padding-top: 18px; }
      .nested { margin-left: 20px; }
    </style>
    <script>
      window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] } };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body>
    {{content}}
  </body>
</html>
