<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <style>
      body { max-width: 760px; margin: 48px auto; padding: 0 20px; color: #202124; font: 18px/1.7 system-ui, sans-serif; }
      h1 { font-size: 1.7em; } h2 { margin-top: 1.5em; font-size: 1.25em; } h3 { margin-top: 1.3em; font-size: 1.1em; } h4 { margin-top: 1.2em; font-size: 1em; }
      section { margin: 28px 0; }
      .formula { margin: 12px 0; overflow-x: auto; }
      .description, .reused { color: #555; } .answer { font-weight: 600; }
      .strategy { margin-top: 36px; }
      .nested { margin-left: 20px; }
      .question { padding: 14px 16px; border-left: 4px solid #555; background: #f6f7f8; white-space: pre-wrap; }
      .recognized-tasks { padding-left: 28px; }
      .item-count { color: #555; }
      .problem-item { margin-top: 38px; padding-top: 18px; border-top: 2px solid #999; }
      .calculation { padding-top: 18px; border-top: 1px solid #ddd; }
      .answer-summary { padding-left: 28px; }
      .answer-summary > li { margin: 18px 0; }
      .answer-summary .answer { margin: 6px 0; }
      .unsupported, .failed { display: inline-block; padding: 8px 12px; font-weight: 700; }
      .unsupported { color: #8a5a00; background: #fff4df; }
      .failed { color: #b00020; background: #fdecef; }
    </style>
    <script>
      window.MathJax = { tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] } };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>
  <body>
    {{content}}
  </body>
</html>
